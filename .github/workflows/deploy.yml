# 自动部署: main 分支有新提交时构建并部署到 Cloudflare Workers
#
# 启用前只需在 GitHub 仓库 Settings → Secrets and variables → Actions 添加两个 secrets:
#   CLOUDFLARE_API_TOKEN   — API Token(模板 "Edit Cloudflare Workers", 见 docs/setup-cloudflare.md §6)
#   CLOUDFLARE_ACCOUNT_ID  — 账户 ID(Dashboard 右侧栏)
# 未配置时本工作流自动跳过部署, 不会报错。
# 注意: 已通过 `wrangler secret put` 设置的密钥(ACCESS_PASSWORD/GATE_SECRET)不受部署影响, 会保留。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 检查是否已配置部署密钥
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "⚠ 未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID, 跳过部署(配置方法见 docs/setup-cloudflare.md §6)"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 安装依赖
        if: steps.check.outputs.configured == 'true'
        run: npm ci

      - name: 构建前端
        if: steps.check.outputs.configured == 'true'
        run: npm run build:web

      - name: 部署 Worker
        if: steps.check.outputs.configured == 'true'
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
